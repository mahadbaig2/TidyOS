[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tidyos"
version = "0.1.0"
description = "Autonomous, local-first file system agent for Windows"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "TidyOS Team" }
]
license = { text = "Proprietary" }
dependencies = [
    "PySide6>=6.7.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "winocr>=0.0.15; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
]
full = [
    "watchdog>=4.0.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "numpy>=1.26.0",
    "onnxruntime>=1.18.0",
    "openai>=1.30.0",
    "langgraph>=0.2.0",
]

[project.scripts]
tidyos = "tidyos.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
